name: build-root
on:
  push:
    paths:
      - "mesh_root/**"
      - ".github/workflows/build-root.yml"
  workflow_dispatch:

jobs:
  build_root:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2.1
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Make git workspace safe (avoids 'dubious ownership')
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build mesh_root
        shell: bash
        run: |
          set -e
          source /opt/esp/idf/export.sh
          cd mesh_root
          idf.py set-target esp32s3
          idf.py --version
          idf.py build

          mkdir -p ../artifacts/mesh_root
          cp -v build/bootloader/bootloader*.bin ../artifacts/mesh_root/ || true
          cp -v build/partition_table/partition-table*.bin ../artifacts/mesh_root/ || true
          # copy the app .bin (exclude bootloader/partition)
          find build -maxdepth 1 -type f -name "*.bin" \
            ! -name "bootloader*.bin" ! -name "partition-table*.bin" \
            -exec cp -v {} ../artifacts/mesh_root/ \;

      - name: Upload root artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh_root-bins
          path: artifacts/mesh_root
